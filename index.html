  <style>
    /* -------------------------------------------------------
       Design tokens — exactly matching aryanmgr2.lovable.app
       ------------------------------------------------------- */
    :root {
      --bg:               oklch(9% .012 260);
      --fg:               oklch(97% .004 260);
      --muted-fg:         oklch(66% .02 260);
      --telegram:         oklch(68% .145 232);
      --telegram-bright:  oklch(80% .12 220);
      --telegram-dark:    oklch(58% .16 245);
      --glow:             oklch(68% .145 232 / .55);
      --glow-soft:        oklch(68% .145 232 / .2);

      color-scheme: dark;
    }

    /* Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* -------------------------------------------------------
       Page wrapper
       ------------------------------------------------------- */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* -------------------------------------------------------
       Background layers
       ------------------------------------------------------- */
    .bg-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 45% at 50% 52%, var(--glow-soft), transparent 70%),
        radial-gradient(ellipse 90% 60% at 50% -10%, oklch(68% .145 232 / .08), transparent 60%);
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(120% 90% at 50% 50%, transparent 55%, oklch(5% .01 260 / .8) 100%);
    }

    /* -------------------------------------------------------
       Header
       ------------------------------------------------------- */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 40px;
      width: 100%;
    }

    /* Live dot with ping ring */
    .live-dot {
      display: inline-block;
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--telegram-bright);
      flex-shrink: 0;
    }

    .live-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: var(--telegram-bright);
      animation: dot-ping 2s ease-out infinite;
    }

    .brand-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--muted-fg);
    }

    /* -------------------------------------------------------
       Main
       ------------------------------------------------------- */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      text-align: center;
      padding: 64px 24px;
      width: 100%;
    }

    /* -------------------------------------------------------
       Glow orb (large atmospheric bloom behind button)
       ------------------------------------------------------- */
    .btn-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow-orb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 560px);
      aspect-ratio: 1;
      border-radius: 9999px;
      background: radial-gradient(circle, var(--glow-soft), transparent 65%);
      filter: blur(40px);
      pointer-events: none;
      animation: orb-breathe 6s ease-in-out infinite;
    }

    /* -------------------------------------------------------
       Telegram button
       ------------------------------------------------------- */
    .btn-telegram {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem 3.25rem;
      border-radius: 9999px;
      overflow: hidden;
      text-decoration: none;
      color: oklch(98% .01 240);
      font-family: inherit;
      font-size: clamp(1.15rem, 2.6vw, 1.6rem);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      background: linear-gradient(135deg,
        var(--telegram-bright),
        var(--telegram) 55%,
        var(--telegram-dark)
      );
      box-shadow:
        0 0 45px -6px  var(--glow),
        0 0 120px -18px var(--glow),
        inset 0 1px 0 oklch(100% 0 0 / .35);
      animation: glow-pulse 2.8s ease-in-out infinite;
      transition: transform .25s, filter .25s;
    }

    /* Shimmer sweep */
    .btn-telegram::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 40%,
        oklch(100% 0 0 / .18) 50%,
        transparent 60%
      );
      background-size: 200% 100%;
      animation: shimmer-sweep 2.8s ease-in-out infinite;
    }

    .btn-telegram:hover {
      filter: brightness(1.08);
      transform: translateY(-2px) scale(1.03);
    }

    .btn-telegram:active {
      transform: translateY(0) scale(.99);
    }

    /* Expanding rings */
    .btn-ring {
      position: absolute;
      inset: -10px;
      border-radius: 9999px;
      border: 1.5px solid var(--telegram);
      opacity: 0;
      pointer-events: none;
      animation: ring-expand 2.8s ease-out infinite;
    }

    .btn-ring-delay {
      animation-delay: 1.4s;
    }

    .btn-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    /* -------------------------------------------------------
       Subtext
       ------------------------------------------------------- */
    .subtext {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted-fg);
      max-width: 280px;
    }

    /* -------------------------------------------------------
       Footer
       ------------------------------------------------------- */
    footer {
      position: relative;
      z-index: 10;
      padding-bottom: 32px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: oklch(66% .02 260 / .6);
      text-align: center;
    }

    /* -------------------------------------------------------
       Keyframe animations (exact match to original)
       ------------------------------------------------------- */
    @keyframes glow-pulse {
      0%, 100% { opacity: .75; }
      50%       { opacity: 1;   }
    }

    @keyframes ring-expand {
      0%   { opacity: .55; transform: scale(1);    }
      100% { opacity: 0;   transform: scale(1.55); }
    }

    @keyframes shimmer-sweep {
      0%   { background-position:  130% center; }
      100% { background-position: -130% center; }
    }

    @keyframes orb-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: .75; }
      50%       { transform: translate(-50%, -50%) scale(1.08); opacity: 1;   }
    }

    @keyframes dot-ping {
      0%   { opacity: .8; transform: scale(1);   }
      100% { opacity: 0;  transform: scale(2.6); }
    }

    /* -------------------------------------------------------
       Accessibility & responsive
       ------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .glow-orb,
      .btn-telegram,
      .btn-telegram::after,
      .btn-ring,
      .btn-ring-delay,
      .live-dot::before {
        animation: none;
      }
      .btn-telegram {
        opacity: 1;
      }
      .btn-telegram:hover {
        transform: none;
        filter: none;
      }
    }

    @media (max-width: 480px) {
      header {
        padding-top: 32px;
      }
      main {
        padding: 48px 20px;
        gap: 32px;
      }
      .btn-telegram {
        padding: 1.25rem 2.5rem;
      }
      .btn-icon {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
